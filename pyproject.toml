[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanchor"
version = "1.1.0"
description = "Inductive batch correction for frozen single-cell foundation model embeddings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "anndata>=0.10",
    "scanpy>=1.10",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
scgpt = ["scgpt"]
baselines = ["harmonypy", "scvi-tools", "scib"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
